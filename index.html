<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>SMHG Church Care</title>

  <meta
    name="theme-color"
    content="#163b2b"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="apple-touch-icon.png"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="SMHG Church Care"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <style>
    :root {
      /*
       * Keep this at zero. The viewport itself is now measured instead of
       * hiding an assumed footer height.
       */
      --apps-script-footer-crop: 0px;
      --app-visible-height: 100vh;
      --app-visible-top: 0px;
      --app-background: #f7f6f1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--app-background);
    }

    .app-viewport {
      position: fixed;
      top: var(--app-visible-top);
      right: 0;
      left: 0;
      width: 100%;
      height: var(--app-visible-height);
      overflow: hidden;
      background: var(--app-background);
    }

    #smhg-app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + var(--apps-script-footer-crop));
      border: 0;
      display: block;
      background: var(--app-background);
    }
  </style>
</head>

<body>
  <main class="app-viewport">
    <iframe
      id="smhg-app"
      src="https://script.google.com/macros/s/AKfycbxZRoJKUhBpVjnbqTUTnT7JDR24OSMQCCldkrZQc-HNIOBvVIoKGzlzn0dZtrcR1B-k/exec"
      title="SMHG Church Care"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </main>

  <script>
    const root = document.documentElement;
    let viewportUpdateFrame = 0;

    function updateVisibleViewport() {
      cancelAnimationFrame(viewportUpdateFrame);

      viewportUpdateFrame = requestAnimationFrame(() => {
        const viewport = window.visualViewport;
        const measuredHeight = viewport
          ? viewport.height
          : document.documentElement.clientHeight || window.innerHeight;
        const measuredTop = viewport ? viewport.offsetTop : 0;

        root.style.setProperty(
          '--app-visible-height',
          `${Math.max(1, Math.floor(measuredHeight))}px`
        );

        root.style.setProperty(
          '--app-visible-top',
          `${Math.max(0, Math.floor(measuredTop))}px`
        );
      });
    }

    updateVisibleViewport();

    window.addEventListener('resize', updateVisibleViewport, { passive: true });
    window.addEventListener('orientationchange', updateVisibleViewport, { passive: true });
    window.addEventListener('pageshow', updateVisibleViewport, { passive: true });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateVisibleViewport();
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateVisibleViewport, { passive: true });
      window.visualViewport.addEventListener('scroll', updateVisibleViewport, { passive: true });
    }

    /* Android standalone mode can settle its final status-bar size after load. */
    window.setTimeout(updateVisibleViewport, 100);
    window.setTimeout(updateVisibleViewport, 500);
    window.setTimeout(updateVisibleViewport, 1500);
  </script>
</body>
</html>
