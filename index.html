<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163b2b">
  <title>SMHG Church Care</title>

  <style>
    :root {
      /*
       * Apps Script may show its own notice/footer at the bottom.
       * Increase or decrease this value if the notice is not fully hidden.
       * Set it to 0px if your deployment does not show the notice.
       */
      --apps-script-footer-crop: 36px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f7f6f1;
    }

    .app-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #f7f6f1;
    }

    #smhg-app {
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: calc(100% + var(--apps-script-footer-crop));
      border: 0;
      display: block;
      background: #f7f6f1;
    }
  </style>
</head>

<body>
  <main class="app-viewport">
    <iframe
      id="smhg-app"
      src="https://script.google.com/macros/s/AKfycbxZRoJKUhBpVjnbqTUTnT7JDR24OSMQCCldkrZQc-HNIOBvVIoKGzlzn0dZtrcR1B-k/exec"
      title="SMHG Church Care"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </main>
</body>
</html>
